name: 'SFTP Upload'
description: 'Upload files to a server using SFTP with SSH private key authentication.'

inputs:
  sftp_username:
    description: 'The username for the SFTP connection.'
    required: true
  server:  
    description: 'The address of the SFTP server.'
    required: true
  port: 
    description: 'The port number for the SFTP server (default: 22).'
    required: true
    default: "22"
  ssh_private_key:
    description: 'SSH private key for authentication. Ensure the format is preserved when copying from your *.pem file.'
    required: false
  local_path:
    description: 'The local path to the files that will be uploaded.'
    required: true
    default: './*'
  remote_path:
    description: 'The remote directory path where the files will be uploaded.'
    required: true
  sftpArgs:
    description: 'Additional arguments for the SFTP command.'
    required: false
  delete_remote_files:
    description: 'If set to true, all files in the remote path will be deleted before the upload. Use with caution.'
    required: false
    default: false
  sftp_password:
    description: 'SSH password. If set, the SSH private key will be ignored.'
    required: false
  use_sftp_for_delete:
    description: 'Use SFTP commands for deletion instead of SSH'
    required: false
    default: true
  ssh_username:
    description: 'Username for SSH operations (defaults to SFTP username if not provided)'
    required: false
  ssh_password:
    description: 'Password for SSH user (defaults to SFTP password if not provided)'
    required: false

runs:
  using: 'docker'
  image: 'Dockerfile'
  args:
    - ${{ inputs.sftp_username }}
    - ${{ inputs.server }}
    - ${{ inputs.port }}
    - ${{ inputs.ssh_private_key }}
    - ${{ inputs.local_path }}
    - ${{ inputs.remote_path }}
    - ${{ inputs.sftpArgs }}
    - ${{ inputs.delete_remote_files }}
    - ${{ inputs.sftp_password }}
    - ${{ inputs.use_sftp_for_delete }}
    - ${{ inputs.ssh_username }}
    - ${{ inputs.ssh_password }}

branding:
  icon: 'upload-cloud'  
  color: 'orange'
